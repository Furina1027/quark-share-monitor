# ============================================================
# 教育部《全国硕士研究生招生工作管理规定》发布监控 · GitHub Actions 版
# ============================================================
# 盯两个源：
#   1) 教育部官方文件列表     http://www.moe.gov.cn/was5/web/search?channelid=239993
#   2) 教育部新闻通稿         http://www.moe.gov.cn/jyb_xwfb/gzdt_gzdt/s5987/
# 命中规则：标题里同时出现「目标年份(2027)」+「全国硕士研究生招生工作管理规定」→ 文件本体
#           同时出现「全国硕士研究生」+「招生」+ 年份            → 相关信号（部署新闻）
# 命中才发邮件，没命中就静默。
#
# 脚本支持 --once（只跑一轮）与 --dry-run（不发信），依赖 requests/bs4/lxml。
# 邮件授权码走 Secret：SMTP_AUTH_CODE（复用仓库里已有的那个）。
#
# 去重记录 moe/data/state.json 存在 GitHub 缓存里，跨轮保留 —— 防止同一份文件重复发信。
# 连续 3 轮所有源都失败时才会发告警邮件（避免偶发抖动刷屏）。
#
# ⚠️ 用外部定时器（cron-job.org）触发 dispatches：本仓库实测 GitHub 自带的 schedule
#    完全不触发，这里保留只是当兜底。
# ============================================================

name: moe-monitor

on:
  schedule:
    # 每小时第 13 分钟（UTC）。夸克 7 分 / B站 23 分 / 南航 41 分已占用，这里错开
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moe-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 恢复去重记录
        uses: actions/cache/restore@v4
        with:
          path: moe-state
          key: moe-state-${{ github.run_id }}
          restore-keys: |
            moe-state-

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r moe/requirements.txt

      - name: 检查教育部文件发布情况
        env:
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          SMTP_RECEIVER: 202046940@qq.com
        run: |
          set -e
          mkdir -p moe-state
          # 状态/日志/命中的正文都写到 moe-state/，由 cache 跨轮保留
          python "moe/教育部.py" --once --state-dir moe-state

      - name: 保存去重记录
        if: always()
        uses: actions/cache/save@v4
        with:
          path: moe-state
          key: moe-state-${{ github.run_id }}

      - name: 上传日志与命中的正文
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moe-log-${{ github.run_number }}
          path: |
            moe-state/logs/*.log
            moe-state/data/documents/*.txt
          retention-days: 7
